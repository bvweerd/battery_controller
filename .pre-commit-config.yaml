repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # mkdocs.yml uses !!python/name: tags for the Material mermaid fence,
      # which safe_load rejects. MkDocs loads it with its own loader.
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: debug-statements
      - id: detect-private-key

  # v3.20.0 crashes on Python 3.14: it calls tokenize.cookie_re, which CPython
  # 3.14 turned into a bytes pattern, giving "cannot use a bytes pattern on a
  # string-like object". v3.21.2 carries its own string-based _cookie_re.
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py313-plus]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=hass,alot,als,datas,dof,dur,farenheit,hist,iff,ines,ist,lightsensor,marge,mut,nd,pres,referer,ser,serie,te,technik,ue,uint,visability,wan,wanna,withing,thirdparty
          - --skip="./.*,*.csv,*.json,*.ambr"
          - --quiet-level=2
        exclude_types: [csv, json]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        # Pin the interpreter: without this, pre-commit builds the hook env
        # with whatever Python it happens to run under, and pip then silently
        # resolves homeassistant-stubs down to the newest release that old
        # interpreter allows. On 3.11 that is 2024.3.3, which predates
        # ConfigEntry.runtime_data and subentries and reports ~70 false
        # positives; on 3.13 it is 2026.2.x. Home Assistant 2026.3 onwards
        # requires Python 3.14.2, so 3.14 is what types against current Core.
        language_version: python3.14
        args: [--ignore-missing-imports]
        additional_dependencies:
          # Floor, so an environment that cannot satisfy it fails loudly
          # instead of quietly type-checking against two-year-old stubs.
          - homeassistant-stubs>=2025.1.0
        files: ^custom_components/battery_controller/
