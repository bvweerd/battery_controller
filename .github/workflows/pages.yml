name: Deploy Pages

on:
  push:
    branches: [dev]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      # --strict turns a broken internal link into a build failure, so a renamed
      # page cannot silently ship a dead link. The analyzer under docs/analyzer/
      # is copied verbatim; docs/__tests__/ is dropped via exclude_docs.
      - name: Build site
        run: mkdocs build --strict --site-dir _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
